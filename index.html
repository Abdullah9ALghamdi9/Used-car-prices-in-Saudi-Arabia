<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>توقع أسعار السيارات المستعملة</title><style>
*{box-sizing:border-box}body{font-family:system-ui,-apple-system,sans-serif;background:#f3f6fb;color:#18263c;margin:0;padding:36px 16px}.wrap{max-width:920px;margin:auto}h1{margin:0 0 8px;font-size:30px}p{color:#64748b}.panel{background:#fff;border-radius:18px;padding:28px;box-shadow:0 8px 28px #172b4a12}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}label{font-size:14px;font-weight:700;display:block}select{display:block;width:100%;margin-top:8px;padding:13px;border:1px solid #cbd5e1;border-radius:10px;font:inherit;background:white;color:#1d2939}select:focus{outline:2px solid #9bc0ff}button{background:#225acb;color:white;border:0;border-radius:10px;width:100%;padding:15px;margin-top:25px;font:inherit;font-weight:700;cursor:pointer}button:disabled{opacity:.6}.result{display:none;margin-top:20px;padding:18px;border-radius:12px;background:#edf4ff}.result.error{background:#fff0f0;color:#a52727}.price{font-size:32px;font-weight:800;color:#1e50a4}.note{font-size:13px;line-height:1.8;margin-top:16px}@media(max-width:620px){.grid{grid-template-columns:1fr}.panel{padding:18px}h1{font-size:24px}}
</style></head><body><main class="wrap"><h1>توقع سعر السيارة المستعملة</h1><p>اختر مواصفات السيارة من القوائم للحصول على تقدير تقريبي بالريال السعودي.</p><section class="panel"><form id="carForm"><div class="grid">
<label>الشركة<select name="Make" required></select></label><label>الموديل<select name="Type" required></select></label>
<label>سنة الصنع<select name="Year" required></select></label><label>بلد الاستيراد<select name="Origin" required></select></label>
<label>الفئة<select name="Options" required></select></label><label>حجم المحرك (لتر)<select name="Engine_Size" required></select></label>
<label>نوع الوقود<select name="Fuel_Type" required></select></label><label>ناقل الحركة<select name="Gear_Type" required></select></label>
<label>الممشى (كم)<select name="Mileage" required></select></label><label>المنطقة<select name="Region" required></select></label>
</div><button type="submit" id="submit" disabled>تحميل الخيارات...</button></form><div id="result" class="result" role="status" aria-live="polite"></div><p class="note">ملحوظة  الاسعار غير ثابته وتتغير على حسب الصدمات وحالة المحرك لذلك ننصح بفحص المركبة قبل الشراء.</p></section></main>
<script>
const form=document.getElementById('carForm'),result=document.getElementById('result'),btn=document.getElementById('submit');
const get=n=>form.elements.namedItem(n);
function fill(name,values){const s=get(name);s.replaceChildren(new Option('اختر...', '',true,true));s.options[0].disabled=true;for(const v of values)s.add(new Option(String(v),String(v)));s.value='';}
const bands=[[0,20000],[20000,50000],[50000,100000],[100000,150000],[150000,200000],[200000,300000],[300000,400000],[400000,600000],[600000,800000],[800000,1000000]];
const mileage=get('Mileage');mileage.add(new Option('اختر نطاق الممشى...', '',true,true));mileage.options[0].disabled=true;
for(const [a,b] of bands)mileage.add(new Option(`${a.toLocaleString('en-US')} – ${b.toLocaleString('en-US')} كم`,String((a+b)/2)));
let pairs={},engineMap={};
async function init(){try{const res=await fetch('/options');if(!res.ok)throw new Error('تعذر تحميل خيارات البيانات');const data=await res.json();pairs=data.makes_models;engineMap=data.engines_by_model_year||{};fill('Make',Object.keys(pairs).sort());fill('Type',[]);fill('Year',data.years);fill('Engine_Size',[]);for(const [key,vals] of Object.entries(data.categories))fill(key,vals);const fuelLabels={Gas:'بنزين',Diesel:'ديزل',Hybrid:'هايبرد'};const fuel=get('Fuel_Type');for(const option of fuel.options){if(fuelLabels[option.value])option.textContent=fuelLabels[option.value];}btn.disabled=false;btn.textContent='توقع السعر';}catch(err){result.style.display='block';result.classList.add('error');result.textContent='خطأ في تحميل الخيارات: '+err.message;btn.textContent='تعذر تحميل الخيارات';}}
function refreshEngines(){const make=get('Make').value,carType=get('Type').value,year=get('Year').value;const engines=engineMap[make]?.[carType]?.[year]||[];fill('Engine_Size',engines.map(v=>Number(v).toFixed(1)));const select=get('Engine_Size');if(!engines.length){select.options[0].textContent='لا توجد بيانات محرك موثوقة لهذا الموديل والسنة';}else if(engines.length===1){select.value=Number(engines[0]).toFixed(1);}}
get('Make').addEventListener('change',()=>{fill('Type',pairs[get('Make').value]||[]);refreshEngines();});
get('Type').addEventListener('change',refreshEngines);
get('Year').addEventListener('change',refreshEngines);
form.addEventListener('submit',async e=>{e.preventDefault();btn.disabled=true;btn.textContent='جارٍ حساب السعر...';result.style.display='none';result.classList.remove('error');const data=Object.fromEntries(new FormData(form).entries());for(const key of ['Year','Mileage','Engine_Size'])data[key]=Number(data[key]);try{const res=await fetch('/predict',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});const body=await res.json();if(!res.ok)throw new Error(JSON.stringify(body.detail??body));result.replaceChildren();const head=document.createElement('div');head.textContent='السعر المتوقع';const price=document.createElement('div');price.className='price';price.textContent=Number(body.predicted_price).toLocaleString('en-US',{maximumFractionDigits:0})+' ريال سعودي';result.append(head,price);}catch(err){result.classList.add('error');result.textContent='تعذر حساب السعر: '+err.message;}finally{result.style.display='block';btn.disabled=false;btn.textContent='توقع السعر';}});
init();
</script></body></html>
